<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú - Urban Bistro</title>
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/articulos.css">
    <link href="https://fonts.cdnfonts.com/css/gokart-bubble" rel="stylesheet">
</head>
<body>

    <header class="encabezado" role="banner">
        <div class="brand">
            <img class="Logo" src="../img/logo.png" alt="Logo de Urban Bistro">
            <div class="brand-copy">
                <h1>Urban Bistro</h1>
                <p>Restaurante &amp; cocina urbana</p>
            </div>
        </div>
        <nav class="menu" aria-label="Menú principal">
            <a class="menu-btn" href="index.html">Inicio</a>
            <a class="menu-btn" href="articulos.html" aria-current="page">Menú</a>
            <a class="menu-btn" href="admin.html">Admin</a>
        </nav>
    </header>

    <div class="main-content">

        <div id="zona-categorias" class="section">
            <h2>Nuestro menú</h2>
            <p>Selecciona una categoría para ver los platillos:</p>

            <div class="articulos-grid">
                <button class="articulo-item" type="button" data-category="Entradas">
                    <div class="articulo-imagen"><img src="../img/entrada.jpg" alt="Platillo de entrada"></div>
                    <h3>Entradas</h3>
                    <p>Ver platillos</p>
                </button>
                <button class="articulo-item" type="button" data-category="Platos Fuertes">
                    <div class="articulo-imagen"><img src="../img/platofuerte.jpg" alt="Plato fuerte con carne y guarnición"></div>
                    <h3>Platos Fuertes</h3>
                    <p>Ver platillos</p>
                </button>
                <button class="articulo-item" type="button" data-category="Postres">
                    <div class="articulo-imagen"><img src="../img/postres.jpg" alt="Cheesecake con frutos rojos"></div>
                    <h3>Postres</h3>
                    <p>Ver platillos</p>
                </button>
                <button class="articulo-item" type="button" data-category="Bebidas">
                    <div class="articulo-imagen"><img src="../img/bebidas.jpg" alt="Selección de bebidas"></div>
                    <h3>Bebidas</h3>
                    <p>Ver platillos</p>
                </button>
            </div>
        </div>

        <div id="zona-productos" class="section" style="display: none;">
            <button id="btn-volver-categorias" class="btn-vaciar" type="button">Volver al menú</button>
            <h2 id="titulo-categoria" tabindex="-1">Platillos</h2>
            <div class="articulos-grid" id="contenedor-articulos"></div>
        </div>

        <div class="carrito-seccion">
            <h3>Mi pedido</h3>
            <ul id="lista-carrito">
                <li>Tu pedido está vacío</li>
            </ul>
            <p class="total-carrito">Total: $<span id="total-precio">0.00</span></p>
            <button id="btn-vaciar" class="btn-vaciar" type="button">Vaciar pedido</button>
            <button id="btn-comprar" class="btn-carrito" type="button">Proceder al pago</button>

            <div id="checkout-section" class="checkout-section" style="display:none;">
                <h4>Finalizar pedido</h4>
                <label for="cliente-nombre">Nombre del cliente</label>
                <input id="cliente-nombre" type="text" placeholder="Tu nombre" required>

                <label for="metodo-pago">Método de pago</label>
                <select id="metodo-pago">
                    <option value="Tarjeta">Tarjeta</option>
                    <option value="Transferencia">Transferencia</option>
                    <option value="Efectivo">Efectivo</option>
                </select>

                <button id="btn-finalizar" class="btn-carrito" type="button">Confirmar pedido</button>

                <div id="invoice-preview" class="invoice-preview" style="display:none;">
                    <h4>Factura emitida</h4>
                    <div id="invoice-content"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="../js/admin.js"></script>
    <script src="../js/jsarticulos.js"></script>
</body>
</html>
